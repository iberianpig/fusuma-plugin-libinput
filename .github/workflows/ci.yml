name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  SPINEL_SHA: 0cda3f993fc371c600870450b62d23d91a4c6499

jobs:
  test:
    name: rspec + native minitest
    runs-on: ubuntu-latest
    steps:
      - name: Install libinput headers (runtime deps for the gem)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libinput-dev libudev-dev

      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake

  native-smoke:
    name: native build smoke
    runs-on: ubuntu-latest
    # Same glibc floor as release builds.
    container: ubuntu:22.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates git pkg-config make \
            libinput-dev libudev-dev

      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Cache spinel build
        id: spinel-cache
        uses: actions/cache@v4
        with:
          path: .spinel
          key: spinel-${{ env.SPINEL_SHA }}-x86_64-linux-gnu

      - name: Build spinel
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/matz/spinel .spinel
          git -C .spinel checkout "$SPINEL_SHA"
          make -C .spinel deps
          make -C .spinel -j"$(nproc)" all

      - name: Build and smoke-test the binary
        run: |
          make -C native SPINEL_DIR="$GITHUB_WORKSPACE/.spinel"
          native/build/fusuma-libinput-events --version
